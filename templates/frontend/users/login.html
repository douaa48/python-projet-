{% extends 'frontend/base.html' %}

{% block content %}
<div class="container" style="margin-top:120px; display:flex; justify-content:center;">

    <div style="width:400px; background:#fff; padding:30px; border-radius:12px; box-shadow:0 5px 20px rgba(0,0,0,0.1);">

        <h2 style="text-align:center; margin-bottom:20px;">Connexion</h2>

        <!-- messages -->
        {% if messages %}
            {% for message in messages %}
                <div style="margin-bottom:10px; color:red;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div style="margin-bottom:15px;">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div style="margin-bottom:15px;">
                <label>Mot de passe</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button class="btn btn-dark btn-full" style="width:100%;">
                Se connecter
            </button>
        </form>

        <p style="margin-top:15px; text-align:center;">
            Pas de compte ?
            <a href="{% url 'signup' %}">Créer un compte</a>
        </p>

    </div>

</div>
{% endblock %}
